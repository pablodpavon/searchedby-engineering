[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shiptools"
version = "0.1.0"
description = "Dependency-free tools to ship a change and prove the server runs what you tested."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Pablo Pavon" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["shiptools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
